stages:
  - verify
  - build
  - publish
  - deploy

default:
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

lint:
  stage: verify
  script:
    - npm run lint
    - npm run typecheck

test:
  stage: verify
  script:
    - npm test

build_app:
  stage: build
  variables:
    NEXT_PUBLIC_SITE_URL: ${SITE_URL}
  script:
    - npm run build
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - .next/
    exclude:
      - .next/cache/**/*

publish_image:
  stage: publish
  image: docker:27.5-cli
  services:
    - name: docker:27.5-dind
      alias: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --build-arg NEXT_PUBLIC_SITE_URL="$SITE_URL" --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  needs:
    - lint
    - test
    - build_app
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_ec2:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - if [ -f "$EC2_SSH_PRIVATE_KEY" ]; then cp "$EC2_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519; else printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519; fi
    - chmod 600 ~/.ssh/id_ed25519
    - if [ -f "$EC2_KNOWN_HOSTS" ]; then cp "$EC2_KNOWN_HOSTS" ~/.ssh/known_hosts; else printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - >-
      printf '%s' "$CI_REGISTRY_PASSWORD" |
      ssh "$EC2_USER@$EC2_HOST"
      "docker login '$CI_REGISTRY' --username '$CI_REGISTRY_USER' --password-stdin &&
      docker pull '$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA' &&
      (docker rm --force product-catalog || true) &&
      docker run --detach --name product-catalog --restart unless-stopped
      --publish 80:3000 '$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA' &&
      for attempt in \$(seq 1 20); do
        if curl --fail --silent http://127.0.0.1/api/health >/dev/null; then exit 0; fi;
        sleep 3;
      done;
      docker logs product-catalog;
      exit 1"
  environment:
    name: production
    url: $SITE_URL
  needs:
    - publish_image
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
